name: Build RADIX2HD
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'master, ArduPilot-4.7, or a tag like Copter-4.7.1'
        default: 'ArduPilot-4.7'
      vehicle:
        description: 'copter / plane / rover'
        default: 'copter'

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:latest
    steps:
      - name: Checkout ArduPilot
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch "${{ inputs.ref }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/ArduPilot/ardupilot.git ardupilot

      - name: Install BrainFPV packer
        run: pip3 install https://github.com/BrainFPV/brainfpv_fw_packer/archive/main.zip

      - name: Build
        working-directory: ardupilot
        run: |
          ./waf configure --board RADIX2HD
          ./waf ${{ inputs.vehicle }}

      - name: Pack and collect
        working-directory: ardupilot
        run: |
          ./libraries/AP_HAL_ChibiOS/hwdef/RADIX2HD/pack_firmware.sh ${{ inputs.vehicle }}
          mkdir -p ../out
          find . -name '*brainfpv*.bin' -exec cp {} ../out/ \;
          cp build/RADIX2HD/bin/*.elf ../out/ || true
          ls -la ../out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: radix2hd-${{ inputs.vehicle }}-${{ inputs.ref }}
          path: out/
